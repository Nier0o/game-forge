name: Enforce Merge Source

on:
  pull_request:
    branches:
      - main

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check if source is development branch
        if: github.head_ref != 'dev'
        run: |
          echo "ERROR: You can only merge into 'main' from the 'dev' branch."
          echo "Your current source branch is: ${{ github.head_ref }}"
          exit 1