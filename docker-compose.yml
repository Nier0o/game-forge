services:
    backend:
        build:
            context: ../game-forge-backend
            dockerfile: Dockerfile
        image: game-forge-backend:latest
        # image: ghcr.io/game-forge-studio/game-forge-backend:latest
        ports:
            - '5000:5000'
        env_file:
            - ../game-forge-backend/.env
        container_name: game-forge-backend
        environment:
            - MONGODB_URL=mongodb://mongo:27017/gameforge
            - NODE_ENV=development
            - MINIO_ENDPOINT=minio
            - MINIO_PORT=9000
            - MINIO_USE_SSL=false
            - MINIO_BUCKET=game-forge-games
            - GEN_SERVICE_URL=http://server:6100
            - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://host.docker.internal:3000
            - GROQ_API_KEY=${GROQ_API_KEY:-}
            - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
            - LLM_PROVIDER=${LLM_PROVIDER:-groq}
            - LLM_MODEL=${LLM_MODEL:-llama-3.3-70b-versatile}
        depends_on:
            mongo:
                condition: service_started
            minio:
                condition: service_healthy

    frontend:
        build:
            context: ../game-forge-frontend
            dockerfile: Dockerfile
        image: game-forge-frontend:latest
        # image: ghcr.io/game-forge-studio/game-forge-frontend:latest
        ports:
            - '3000:3000'
        env_file:
            - ../game-forge-frontend/.env
        container_name: game-forge-frontend
        depends_on:
            - backend

    server:
        build:
            context: ../game-forge-server
            dockerfile: Dockerfile
        image: game-forge-server:latest
        # image: ghcr.io/game-forge-studio/game-forge-server:latest
        ports:
            - '6100:6100'
        container_name: game-forge-server
        env_file:
            - ../game-forge-server/.env
        environment:
            - MONGODB_URL=mongodb://mongo:27017/gameforge
            - MINIO_ENDPOINT=minio
            - MINIO_PORT=9000
            - MINIO_USE_SSL=false
            - MINIO_BUCKET=game-forge-games
            - PORT=6100
        depends_on:
            mongo:
                condition: service_started
            minio:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:6100/health']
            interval: 10s
            timeout: 5s
            retries: 3

    planner:
        build:
            context: ../game-forge-planner
            dockerfile: Dockerfile
        image: game-forge-planner:latest
        # image: ghcr.io/game-forge-studio/game-forge-planner:latest
        ports:
            - '6101:6101'
        container_name: game-forge-planner
        volumes:
            - ../game-forge-code/src/archetypes:/app/archetypes:ro
        environment:
            - ARCHETYPES_DIR=/app/archetypes
            - PORT=6101
            - NODE_ENV=development
            - MONGODB_URL=mongodb://mongo:27017/gameforge
            - GEN_SERVICE_SECRET=${GEN_SERVICE_SECRET:-}
            - PLANNER_PROVIDER=${PLANNER_PROVIDER:-groq}
            - PLANNER_MODEL=${PLANNER_MODEL:-}
            - GROQ_API_KEY=${GROQ_API_KEY:-}
            - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
        depends_on:
            mongo:
                condition: service_started
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:6101/health']
            interval: 10s
            timeout: 5s
            retries: 3

    assets-mcp:
        build:
            context: ../assets-mcp
            dockerfile: Dockerfile
        image: assets-mcp:latest
        # image: ghcr.io/game-forge-studio/assets-mcp:latest
        ports:
            - '8765:8765'
        container_name: assets-mcp
        environment:
            - MCP_TRANSPORT=streamable-http
            - MCP_SSE_HOST=0.0.0.0
            - MCP_SSE_PORT=8765
            - MINIO_ENDPOINT=minio
            - MINIO_PORT=9000
            - MINIO_USE_SSL=false
            - MINIO_BUCKET=game-forge-games
            - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-gameforge}
            - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-change-me-in-production}
            - STABILITY_API_KEY=${STABILITY_API_KEY:-}
            - SPRITEFLOW_SESSION_TOKEN=${SPRITEFLOW_SESSION_TOKEN:-}
        depends_on:
            minio:
                condition: service_healthy

    asset:
        build:
            context: ../game-forge-asset
            dockerfile: Dockerfile
        image: game-forge-asset:latest
        # image: ghcr.io/game-forge-studio/game-forge-asset:latest
        ports:
            - '6102:6102'
        container_name: game-forge-asset
        environment:
            - PORT=6102
            - NODE_ENV=development
            - MONGODB_URL=mongodb://mongo:27017/gameforge
            - MINIO_ENDPOINT=minio
            - MINIO_PORT=9000
            - MINIO_USE_SSL=false
            - MINIO_BUCKET=game-forge-games
            - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-gameforge}
            - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-change-me-in-production}
            - GEN_SERVICE_SECRET=${GEN_SERVICE_SECRET:-}
            - THEME_PROVIDER=${THEME_PROVIDER:-groq}
            - THEME_MODEL=${THEME_MODEL:-llama-3.3-70b-versatile}
            - GROQ_API_KEY=${GROQ_API_KEY:-}
            - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
            - MCP_SERVICE_URL=http://assets-mcp:8765/mcp
        depends_on:
            mongo:
                condition: service_started
            minio:
                condition: service_healthy
            assets-mcp:
                condition: service_started
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:6102/health']
            interval: 10s
            timeout: 5s
            retries: 3

    code:
        build:
            context: ../game-forge-code
            dockerfile: Dockerfile
        image: game-forge-code:latest
        # image: ghcr.io/game-forge-studio/game-forge-code:latest
        ports:
            - '6103:6103'
        container_name: game-forge-code
        environment:
            - PORT=6103
            - NODE_ENV=development
            - MINIO_ENDPOINT=minio
            - MINIO_PORT=9000
            - MINIO_USE_SSL=false
            - MINIO_BUCKET=game-forge-games
            - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-gameforge}
            - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-change-me-in-production}
            - GEN_SERVICE_SECRET=${GEN_SERVICE_SECRET:-}
            - CODER_PROVIDER=${CODER_PROVIDER:-groq}
            - CODER_MODEL=${CODER_MODEL:-}
            - GROQ_API_KEY=${GROQ_API_KEY:-}
            - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
        depends_on:
            minio:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:6103/health']
            interval: 10s
            timeout: 5s
            retries: 3

    builder:
        build:
            context: ../game-forge-builder
            dockerfile: Dockerfile
        image: game-forge-builder:latest
        # image: ghcr.io/game-forge-studio/game-forge-builder:latest
        ports:
            - '6104:6104'
        container_name: game-forge-builder
        environment:
            - PORT=6104
            - NODE_ENV=development
            - MINIO_ENDPOINT=minio
            - MINIO_PORT=9000
            - MINIO_USE_SSL=false
            - MINIO_BUCKET=game-forge-games
            - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-gameforge}
            - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-change-me-in-production}
            - GEN_SERVICE_SECRET=${GEN_SERVICE_SECRET:-}
            - GODOT_PATH=/usr/local/bin/godot
            - SKIP_GODOT_EXPORT=${SKIP_GODOT_EXPORT:-false}
            - BACKEND_URL=http://backend:5000
        depends_on:
            minio:
                condition: service_healthy
            backend:
                condition: service_started
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:6104/health']
            interval: 10s
            timeout: 5s
            retries: 3

    mongo:
        image: mongo:latest
        ports:
            - '27017:27017'
        container_name: game-forge-mongo
        volumes:
            - mongo-data:/data/db

    minio:
        image: minio/minio:latest
        container_name: game-forge-minio
        command: server /data --console-address ":9001"
        ports:
            - '9000:9000'
            - '9001:9001'
        environment:
            - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-gameforge}
            - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-change-me-in-production}
        volumes:
            - minio-data:/data
        healthcheck:
            test: ['CMD', 'mc', 'ready', 'local']
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    mongo-data:
    minio-data:
