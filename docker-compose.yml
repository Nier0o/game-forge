services:
    backend:
        # build:
        #     context: ../game-forge-backend
        #     dockerfile: Dockerfile
        # image: game-forge-backend:latest
        image: ghcr.io/game-forge-studio/game-forge-backend:latest
        ports:
            - '5000:5000'
        env_file:
            - ../game-forge-backend/.env
        container_name: game-forge-backend
        environment:
            - MONGODB_DOCKER_URL=mongodb://mongo:27017/gameforge
            - NODE_ENV=development
            - MINIO_ENDPOINT=minio
            - MINIO_PORT=9000
            - MINIO_USE_SSL=false
            - MINIO_BUCKET=game-forge-games
        depends_on:
            mongo:
                condition: service_started
            minio:
                condition: service_healthy

    frontend:
            # build:
            #     context: ../game-forge-frontend
            #     dockerfile: Dockerfile
            # image: game-forge-frontend:latest
            image: ghcr.io/game-forge-studio/game-forge-frontend:latest
            ports:
                - '3000:3000'
            env_file:
                - ../game-forge-frontend/.env
            container_name: game-forge-frontend
            depends_on:
                - backend

    mongo:
        image: mongo:latest
        ports:
            - '27017:27017'
        container_name: game-forge-mongo
        volumes:
            - mongo-data:/data/db

    minio:
        image: minio/minio:latest
        container_name: game-forge-minio
        command: server /data --console-address ":9001"
        ports:
            - '9000:9000'
            - '9001:9001'
        env_file:
            - ../game-forge-backend/.env
        volumes:
            - minio-data:/data
        healthcheck:
            test: ["CMD", "mc", "ready", "local"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    mongo-data:
    minio-data:
