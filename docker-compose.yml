services:
    backend:
        image: ghcr.io/game-forge-studio/game-forge-backend:latest
        ports:
            - '5000:5000'
        env_file:
            - ../game-forge-backend/.env
        container_name: game-forge-backend
        environment:
            - DATABASE_LOCAL=mongodb://mongo:27017/gameforge
            - NODE_ENV=development
        depends_on:
            - mongo

    mongo:
        image: mongo:latest
        ports:
            - '27017:27017'
        container_name: game-forge-mongo
        volumes:
            - mongo-prod-data:/data/db

    frontend:
        image: ghcr.io/game-forge-studio/game-forge-frontend:latest
        ports:
            - '3000:3000'
        env_file:
            - ../game-forge-frontend/.env
        container_name: game-forge-frontend
        environment:
            - VITE_API_URL=http://backend:5000
        depends_on:
            - backend
        extra_hosts:
            - "backend:host-gateway"

